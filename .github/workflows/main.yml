name: refresh config_files
# Titre du run : « (dry run) » si la case est cochée (suffixe lu par entree-carto.yml),
# « (dist-test : <branche>) » pour une publication de test depuis une autre branche que main.
run-name: "refresh config_files${{ inputs.dry_run == true && ' (dry run)' || (github.ref != 'refs/heads/main' && format(' (dist-test : {0})', github.ref_name) || '') }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        # La description est statique (pas d'expression possible) : elle couvre les deux cas.
        description: "Dry run : ne rien publier, fichiers téléchargeables dans les artifacts du run. Décoché : publication sur dist si lancé depuis main, sur dist-test depuis une autre branche."
        type: boolean
        default: false
  schedule:
    - cron: "0 6-18 * * 1-5"

jobs:
  refresh_config:
    runs-on: ubuntu-latest
    # Les publications sur dist-test (branche ≠ main, sans dry run) partagent le groupe
    # de generate-test.yml pour ne jamais pousser en même temps sur dist-test.
    # Les autres runs (main, dry run) ont un groupe unique : aucune contrainte.
    concurrency:
      group: ${{ (github.ref != 'refs/heads/main' && inputs.dry_run != true) && 'generate-config-test' || format('refresh-config-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      # Choisi au lancement manuel (case « dry_run ») ; le cron tourne sur main sans input → publication.
      DRY_RUN: ${{ inputs.dry_run == true }}
      # Cible de publication hors dry run : dist depuis main, dist-test depuis toute autre branche.
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        # Sans « ref », on clone la branche qui a déclenché le run : main pour le cron,
        # la branche choisie pour un lancement manuel (permet de tester une branche).
        # fetch-depth: 0 récupère tout l'historique et toutes les branches distantes,
        # ce qui est nécessaire pour pouvoir basculer ensuite sur la branche dist.
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate config files
        # On génère les fichiers de configuration dans le dossier dist/.
        # Ce dossier est ignoré par .gitignore sur main : il ne sera jamais
        # commité sur cette branche, seulement utilisé comme espace de travail temporaire.
        run: |
          mkdir -p dist
          cat keys.txt | xargs -L 1 python main.py --referer https://cartes.gouv.fr/
          python main.py full

      - name: Upload generated files (dry run)
        # En dry run, rien n'est publié : les fichiers générés sont téléchargeables
        # depuis la page du run (section « Artifacts »).
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-dry-run
          path: dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Push generated files to dist branch
        # On pousse le contenu généré sur la branche dédiée « dist »
        # via un worktree temporaire, sans changer la branche courante.
        if: env.DRY_RUN != 'true' && env.IS_MAIN == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # Sauvegarde des fichiers générés hors du dépôt principal.
          cp -r dist /tmp/dist-generated

          # Prépare un worktree temporaire sur la branche dist.
          DIST_WORKTREE=/tmp/geoportal-dist-worktree
          rm -rf "$DIST_WORKTREE"
          git fetch origin dist:dist
          git worktree add "$DIST_WORKTREE" dist

          cd "$DIST_WORKTREE"
          git pull --rebase origin dist

          # Fusionne les fichiers générés dans dist/ sans supprimer les fichiers existants.
          # tous les fichiers non modifiés restent conservés
          mkdir -p dist
          rsync -a /tmp/dist-generated/ dist/

          # Commit uniquement si des modifications ont été détectées.
          git add dist/
          git diff --cached --quiet || git commit -m "refresh config files"
          git push origin dist

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$DIST_WORKTREE"

      - name: Trim dist branch history
        if: env.DRY_RUN != 'true' && env.IS_MAIN == 'true'
        run: sh ./scripts/trim_dist_history.sh 100 dist

      - name: Push generated files to dist-test branch
        # Hors de main et sans dry run : publication de test sur DIST_BRANCH (dist-test),
        # jamais sur dist. DIST_BRANCH et MAX_COMMIT viennent de envs/test.env, comme pour
        # generate-test.yml. Les fichiers générés sont fusionnés (rsync sans --delete) :
        # entreeCarto.json déjà présent sur dist-test est conservé.
        if: env.DRY_RUN != 'true' && env.IS_MAIN != 'true'
        run: |
          test -f envs/test.env || { echo "Fichier envs/test.env introuvable"; exit 1; }
          DIST_BRANCH="$(sed -n 's/^DIST_BRANCH=//p' envs/test.env | tail -n 1)"
          MAX_COMMIT="$(sed -n 's/^MAX_COMMIT=//p' envs/test.env | tail -n 1)"
          case "$DIST_BRANCH" in
            dist-*) ;;
            *) echo "DIST_BRANCH doit commencer par 'dist-' (reçu : $DIST_BRANCH)"; exit 1 ;;
          esac
          case "$MAX_COMMIT" in
            ''|*[!0-9]*|0) echo "MAX_COMMIT doit être un entier > 0 (reçu : $MAX_COMMIT)"; exit 1 ;;
          esac

          git config user.name github-actions
          git config user.email github-actions@github.com

          DIST_WORKTREE="$RUNNER_TEMP/dist-test-worktree"
          rm -rf "$DIST_WORKTREE"

          # Branche orpheline créée si elle n'existe pas encore. Ref complète obligatoire :
          # « --heads dist-test » matcherait aussi feat/dist-test (comparaison sur le suffixe).
          if git ls-remote --exit-code origin "refs/heads/$DIST_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$DIST_BRANCH:refs/heads/$DIST_BRANCH"
            git worktree add "$DIST_WORKTREE" "$DIST_BRANCH"
          else
            git worktree add --orphan -b "$DIST_BRANCH" "$DIST_WORKTREE"
          fi

          mkdir -p "$DIST_WORKTREE/dist"
          rsync -a dist/ "$DIST_WORKTREE/dist/"

          cd "$DIST_WORKTREE"
          git add dist/
          git diff --cached --quiet || git commit -m "refresh config files (test, branche : $GITHUB_REF_NAME)"
          git push origin "$DIST_BRANCH"

          sh "$GITHUB_WORKSPACE/scripts/trim_dist_history.sh" "$MAX_COMMIT" "$DIST_BRANCH"

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$DIST_WORKTREE"
