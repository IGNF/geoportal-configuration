name: refresh config_files
run-name: "refresh config_files${{ (github.ref != 'refs/heads/main' || inputs.dry_run == true) && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run : générer les fichiers sans les publier sur la branche dist (toujours activé hors de main)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6-18 * * 1-5"

jobs:
  refresh_config:
    runs-on: ubuntu-latest
    # Filet de sécurité : un run nominal dure 30-40 min. Au-delà, on coupe
    # (rien n'est poussé, la branche dist garde sa dernière version complète).
    timeout-minutes: 90
    env:
      # Dry run forcé sur toute autre branche que main ; sur main, choisi au lancement
      # manuel (case « dry_run »). Le cron tourne sur main sans input → publication.
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || inputs.dry_run == true }}
    steps:
      - name: Checkout
        # Sans « ref », on clone la branche qui a déclenché le run : main pour le cron,
        # la branche choisie pour un lancement manuel (permet de tester une branche).
        # fetch-depth: 0 récupère tout l'historique et toutes les branches distantes,
        # ce qui est nécessaire pour pouvoir basculer ensuite sur la branche dist.
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate config files
        # On génère les fichiers de configuration dans le dossier dist/.
        # Ce dossier est ignoré par .gitignore sur main : il ne sera jamais
        # commité sur cette branche, seulement utilisé comme espace de travail temporaire.
        # Une clé en échec (service injoignable) n'écrit pas son fichier : sa version
        # actuelle sur dist est conservée, les autres clés sont tout de même mises à jour.
        # Les clés en échec sont listées dans FAILED_KEYS et font échouer le job à la fin.
        run: |
          mkdir -p dist
          failed=""
          while read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            # $line non quoté volontairement : une ligne peut contenir plusieurs clés (ex. "full entree-carto")
            python main.py --referer https://cartes.gouv.fr/ $line || failed="$failed [$line]"
          done < keys.txt
          python main.py full || failed="$failed [full]"
          echo "FAILED_KEYS=$failed" >> "$GITHUB_ENV"

      - name: Upload generated files (dry run)
        # En dry run, rien n'est publié : les fichiers générés sont téléchargeables
        # depuis la page du run (section « Artifacts »).
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-dry-run
          path: dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Push generated files to dist branch
        # On pousse le contenu généré sur la branche dédiée « dist »
        # via un worktree temporaire, sans changer la branche courante.
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # Sauvegarde des fichiers générés hors du dépôt principal.
          cp -r dist /tmp/dist-generated

          # Prépare un worktree temporaire sur la branche dist.
          DIST_WORKTREE=/tmp/geoportal-dist-worktree
          rm -rf "$DIST_WORKTREE"
          git fetch origin dist:dist
          git worktree add "$DIST_WORKTREE" dist

          cd "$DIST_WORKTREE"
          git pull --rebase origin dist

          # Fusionne les fichiers générés dans dist/ sans supprimer les fichiers existants.
          # tous les fichiers non modifiés restent conservés
          mkdir -p dist
          rsync -a /tmp/dist-generated/ dist/

          # Commit uniquement si des modifications ont été détectées.
          git add dist/
          git diff --cached --quiet || git commit -m "refresh config files"
          git push origin dist

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$DIST_WORKTREE"

      - name: Trim dist branch history
        if: env.DRY_RUN != 'true'
        run: sh ./scripts/trim_dist_history.sh 100 dist

      - name: Fail if some keys were not generated
        # Les fichiers des autres clés ont été poussés (sauf dry run) ; on signale ici
        # celles dont la config n'a pas pu être régénérée (version précédente conservée sur dist).
        if: env.FAILED_KEYS != ''
        run: |
          echo "::error::Config non régénérée (service injoignable) pour :${FAILED_KEYS}"
          exit 1
